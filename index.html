<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעקב שתיית מים - אישי</title>
    
    <!-- פונטים ואייקונים -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- עיצוב חיצוני -->
    <link rel="stylesheet" href="style.css">
    
    <!-- ספריות Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

    <div class="container" id="appContainer">
        <header>
            <h1><i class="fa-solid fa-glass-water"></i> מעקב שתייה</h1>
            <p>מאזן השתייה היומי שלך</p>
        </header>

        <div class="water-container">
            <div class="bottle">
                <div class="water-fill" id="waterFill"></div>
                <div class="progress-text">
                    <div class="amount" id="currentAmount">0 / 2000</div>
                    <div class="percentage" id="percentage">0% מהיעד</div>
                </div>
            </div>
        </div>

        <div class="quick-add">
            <button class="btn-add" onclick="addWater(200)">
                <i class="fa-solid fa-glass-water"></i>
                <span>כוס (200 מ"ל)</span>
            </button>
            <button class="btn-add" onclick="addWater(330)">
                <i class="fa-solid fa-bottle-water"></i>
                <span>בקבוק קטן (330 מ"ל)</span>
            </button>
            <button class="btn-add" onclick="addWater(500)">
                <i class="fa-solid fa-bottle-droplet"></i>
                <span>בקבוק (500 מ"ל)</span>
            </button>
        </div>

        <div class="goal-controls">
            <label for="goalInput">יעד יומי (מ"ל):</label>
            <div class="goal-input-group">
                <input type="number" id="goalInput" value="2000" step="100" min="500" max="5000">
            </div>
        </div>

        <div class="history-section">
            <h3><i class="fa-solid fa-clock-rotate-left"></i> היסטוריה להיום</h3>
            <ul class="history-list" id="historyList">
                <li class="empty-history">טוען נתונים...</li>
            </ul>
        </div>
    </div>

    <!-- לוגיקה וחיבור לענן -->
    <script src="script.js"></script>
</body>
</html>
